4, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --bone:#f1ece2;\n    --bone-2:#ebe4d6;\n    --paper:#f7f3eb;\n    --ink:#141310;\n    --ink-2:#3a342a;\n    --muted:#7a7266;\n    --gold:#b8963e;\n    --gold-deep:#8c6f24;\n    --gold-soft:#d9bf84;\n    --green:#5a7a4a;\n    --red:#a44a3a;\n    --rule:rgba(20,19,16,0.18);\n    --rule-soft:rgba(20,19,16,0.09);\n  }\n  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n  html,body{background:var(--bone);color:var(--ink);font-family:'Montserrat',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}\n  body{min-height:100vh}\n  .grain{position:fixed;inset:0;pointer-events:none;z-index:50;mix-blend-mode:multiply;opacity:.3;\n    background-image:\n      radial-gradient(rgba(20,19,16,.10) 1px, transparent 1.2px),\n      radial-gradient(rgba(184,150,62,.08) 1px, transparent 1.4px);\n    background-size: 3px 3px, 5px 5px;\n  }\n\n  .page{max-width:1440px;margin:0 auto;padding:28px 48px 36px;position:relative}\n\n  .corner{position:absolute;width:18px;height:18px;border:1px solid var(--ink);opacity:.55}\n  .corner.tl{top:14px;left:14px;border-right:none;border-bottom:none}\n  .corner.tr{top:14px;right:14px;border-left:none;border-bottom:none}\n  .corner.bl{bottom:14px;left:14px;border-right:none;border-top:none}\n  .corner.br{bottom:14px;right:14px;border-left:none;border-top:none}\n\n  /* Masthead */\n  .masthead{\n    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:32px;\n    padding-bottom:16px;border-bottom:1px solid var(--ink);\n  }\n  .mast-left,.mast-right{display:flex;align-items:center;gap:14px;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink-2);font-weight:500}\n  .mast-right{justify-content:flex-end}\n  .mast-dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}\n  .mast-center{display:flex;align-items:center;gap:14px}\n  .mast-center img{heigh or:var(--ink);letter-spacing:-1px}\n  .stat .v em{font-style:italic;color:var(--gold-deep);font-weight:500}\n  .stat .v.up{color:var(--green)}\n  .stat .v.dn{color:var(--red)}\n  .stat .s{font-size:10.5px;color:var(--ink-2);font-family:'Cormorant Garamond',serif;font-style:italic}\n\n  /* Chart frame */\n  .chart-card{\n    margin-top:0;padding:26px 26px 22px;background:var(--paper);border:1px solid var(--rule);\n    position:relative;\n  }\n  .chart-card::before,.chart-card::after{\n    content:\"\";position:absolute;width:10px;height:10px;border:1px solid var(--gold-deep);opacity:.6;\n  }\n  .chart-card::before{top:-1px;left:-1px;border-right:none;border-bottom:none}\n  .chart-card::after{bottom:-1px;right:-1px;border-left:none;border-top:none}\n\n  .chart-head{\n    display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:18px;\n  }\n  .legend{display:flex;gap:22px;flex-wrap:wrap}\n  .lg{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:8px 0}\n  .lg .swatch{width:28px;height:3px;border-radius:2px;background:var(--ink)}\n  .lg.dc .swatch{background:var(--gold-deep)}\n  .lg .name{font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink-2);font-weight:500}\n  .lg .name em{font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:1px;color:var(--ink);font-size:13px;text-transform:none}\n  .lg .val{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);letter-spacing:.5px;font-weight:500}\n  .lg.off{opacity:.35}\n\n  .controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap}\n  .ranges{display:flex;border:1px solid var(--ink);overflow:hidden}\n  .ranges button{\n    background:transparent;border:none;padding:9px 14px;font:inherit;\n    font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink-2);font-weight:500;\n    cursor:pointer;border-right:1px solid var(--ink);transition:background .2s,color .2s;\n  }\n  .ranges
